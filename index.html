<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitungsquerschnitt</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.log('SW Fehler:', err));
            });
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional">

    <style>
        /* Fix für PWA-Ränder und den blauen Hintergrund */
        html {
            background-color: #000000 !important;
            overscroll-behavior-y: none;
        }
        body {
            background-color: #3289D1 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
            font-variant-numeric: tabular-nums;
        }

        input, span, select {
            font-variant-numeric: tabular-nums;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            appearance: textfield;
            -moz-appearance: textfield;
        }

        .tab-btn {
            background-color: #F9FAFB;
            color: #4B5563;
            transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out;
        }

        .tab-btn.active {
            background-color: white !important;
            color: #3B82F6 !important;
            font-weight: 600;
            border-color: #E5E7EB;
            border-bottom-color: white;
            margin-bottom: -1px;
        }
    </style>
</head>
<body class="min-h-screen w-full flex text-gray-800 items-start justify-center p-4 pt-4">

    <div class="w-full max-w-lg mx-auto bg-white rounded-2xl shadow-lg p-4 md:p-5">
        <div class="text-center mb-4">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800 tracking-tight">Leitungsquerschnitt</h1>
            <p class="text-gray-500 text-sm mt-1">Inkl. Berechnung des Spannungsabfalls</p>
        </div>

        <div class="mb-3 border-b border-gray-200">
            <nav class="-mb-px flex space-x-2" aria-label="Tabs">
                <button type="button" id="tab-current" class="tab-btn py-1.5 px-3 border text-sm font-medium rounded-t-lg focus:outline-none">
                    Nach A
                </button>
                <button type="button" id="tab-diameter" class="tab-btn py-1.5 px-3 border text-sm font-medium rounded-t-lg focus:outline-none">
                    Nach ø
                </button>
                <button type="button" id="tab-cross-section" class="tab-btn py-1.5 px-3 border text-sm font-medium rounded-t-lg focus:outline-none">
                    Nach mm²
                </button>
            </nav>
        </div>

        <div>
            <!-- Tabs für die spezifische Eingabe -->
            <div id="panel-current">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <label for="current" class="text-base font-semibold text-gray-800">Stromstärke (in A)</label>
                    <input type="text" id="current" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="z.B. 16" class="p-2 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition w-[140px]">
                </div>
            </div>

            <div id="panel-diameter" class="hidden">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <label for="diameter" class="text-base font-semibold text-gray-800">Durchmesser (in mm)</label>
                    <input type="text" id="diameter" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="z.B. 1,38" class="p-2 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition w-[140px]">
                </div>
            </div>

            <div id="panel-cross-section" class="hidden">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <label for="cross-section" class="text-base font-semibold text-gray-800">Querschnitt (in mm²)</label>
                    <input type="text" id="cross-section" list="cross-section-options" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="z.B. 1,5" class="p-2 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition w-[140px]">
                    <datalist id="cross-section-options">
                        <option value="0,013">0,013 mm² - Mikroelektronik</option>
                        <option value="0,03">0,03 mm² - Mikroelektronik / Sensorik</option>
                        <option value="0,05">0,05 mm² - Mikroelektronik / Sensorik</option>
                        <option value="0,08">0,08 mm² - Sensorik / AWG</option>
                        <option value="0,14">0,14 mm² - Elektronik / Steuerleitungen</option>
                        <option value="0,25">0,25 mm² - Elektronik / Steuerleitungen</option>
                        <option value="0,34">0,34 mm² - Steuerleitungen (M8/M12)</option>
                        <option value="0,5">0,5 mm² - Steuerleitungen / Signalkabel</option>
                        <option value="0,75">0,75 mm² - Flexible Anschlussleitungen</option>
                        <option value="1,0">1,0 mm² - Geräteanschlussleitungen</option>
                        <option value="1,5">1,5 mm² - Lichtstromkreise / VDE</option>
                        <option value="2,5">2,5 mm² - Steckdosenstromkreise</option>
                        <option value="4">4,0 mm² - Herde / Durchlauferhitzer</option>
                        <option value="6">6,0 mm² - Unterverteiler / Wallboxen</option>
                        <option value="10">10,0 mm² - Hauptzuleitungen</option>
                        <option value="16">16,0 mm² - Hausanschlussleitungen</option>
                        <option value="25">25,0 mm² - Industrielle Zuleitungen</option>
                        <option value="35">35,0 mm² - Industrielle Zuleitungen</option>
                        <option value="50">50,0 mm² - Trafostationen</option>
                    </datalist>
                </div>
            </div>

            <!-- Gemeinsame Parameter -->
            <div class="border-t border-gray-200 pt-2.5 mt-2 space-y-2">
                <div class="flex items-center justify-between gap-2">
                    <label for="voltage" class="text-base font-semibold text-gray-800">Spannung (in V)</label>
                    <input type="text" id="voltage" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" value="12" class="p-2 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition w-[140px]">
                </div>
                <div class="flex items-center justify-between gap-2">
                    <label for="length" class="text-base font-semibold text-gray-800">Länge (in m)</label>
                    <input type="text" id="length" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" value="1" class="p-2 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition w-[140px]">
                </div>
                <div class="flex items-center justify-between gap-2">
                    <label for="material" class="text-base font-semibold text-gray-800">Material</label>
                    <select id="material" class="p-2 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition w-[140px]">
                        <option value="copper">Kupfer</option>
                        <option value="aluminum">Aluminium</option>
                    </select>
                </div>
                <div class="flex items-center justify-between gap-2">
                    <label for="installation" class="text-base font-semibold text-gray-800">Verlegeart</label>
                    <select id="installation" class="p-2 text-base font-medium bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition w-[140px]">
                        <option value="air">Frei in der Luft</option>
                        <option value="wall">In o. an Wand</option>
                        <option value="ground">Im Erdboden</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="error-message" class="text-red-500 text-center text-sm mt-3 font-semibold hidden"></div>

        <!-- Ergebnis mit kompakter Zeilenhöhe -->
        <div id="results-container" class="mt-3 pt-3 border-t border-gray-200 hidden">
            <h2 class="text-lg font-bold text-center text-gray-800 mb-2">Ergebnis</h2>
            <div class="grid grid-cols-1 gap-1.5">
                <div id="result-cross-section-container" class="bg-blue-50 py-2 px-3.5 rounded-xl flex items-center justify-between leading-tight">
                    <span class="text-lg font-bold text-blue-900">Querschnitt:</span>
                    <span id="result-cross-section" class="text-lg font-bold text-blue-950"></span>
                </div>
                <div id="result-standard-cross-section-container" class="bg-blue-100 py-2 px-3.5 rounded-xl flex items-center justify-between leading-tight">
                    <span class="text-lg font-bold text-blue-900">Nächster Standard:</span>
                    <span id="result-standard-cross-section" class="text-lg font-bold text-blue-950"></span>
                </div>
                <div id="result-diameter-container" class="bg-green-50 py-2 px-3.5 rounded-xl flex items-center justify-between leading-tight">
                    <span class="text-lg font-bold text-green-900">Durchmesser:</span>
                    <span id="result-diameter" class="text-lg font-bold text-green-950"></span>
                </div>
                <div id="result-current-container" class="bg-purple-50 py-2 px-3.5 rounded-xl flex items-center justify-between leading-tight">
                    <span class="text-lg font-bold text-purple-900">Max. Stromstärke:</span>
                    <span id="result-current" class="text-lg font-bold text-purple-950"></span>
                </div>
                <div id="result-voltagedrop-container" class="bg-yellow-50 py-2 px-3.5 rounded-xl flex items-center justify-between leading-tight">
                    <span class="text-lg font-bold text-yellow-900">Spannungsfall:</span>
                    <span id="result-voltagedrop" class="text-lg font-bold text-yellow-950"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const standardCrossSections = [0.013, 0.03, 0.05, 0.08, 0.14, 0.25, 0.34, 0.5, 0.75, 1.0, 1.5, 2.5, 4, 6, 10, 16, 25, 35, 50];
        const currentCapacity = {
            copper: {
                air:    [0.5, 1.0, 1.5, 2.0, 3, 5, 7, 9, 12, 15, 19.5, 26, 34, 44, 61, 82, 108, 135, 168],
                wall:   [0.4, 0.8, 1.2, 1.6, 2.5, 4, 6, 8, 10, 10, 15.5, 21, 28, 36, 50, 68, 89, 111, 138],
                ground: [0.8, 1.5, 2.0, 3.0, 5, 7, 9, 12, 15, 18, 24, 32, 42, 53, 73, 98, 125, 155, 180]
            },
            aluminum: {
                air:    [0.4, 0.8, 1.2, 1.6, 2.3, 3.9, 5.5, 7, 9.4, 11.7, 15.2, 20.3, 26.5, 34.3, 47.6, 64, 84.2, 105, 131],
                wall:   [0.3, 0.6, 0.9, 1.3, 1.9, 3.1, 4.7, 6.2, 7.8, 10.1, 12.9, 16.4, 21.8, 28.1, 39, 53, 69.4, 86.6, 108],
                ground: [0.6, 1.1, 1.6, 2.5, 3.9, 5.5, 7, 9.4, 11.7, 14, 18.7, 25, 32.8, 41.3, 57, 76.4, 97.5, 121, 140]
            }
        };
        const CONDUCTIVITY = { copper: 56, aluminum: 36 };
        const VOLTAGE_DROP_LIMIT = 0.03;

        const tabCurrent = document.getElementById('tab-current');
        const tabDiameter = document.getElementById('tab-diameter');
        const tabCrossSection = document.getElementById('tab-cross-section');
        const panelCurrent = document.getElementById('panel-current');
        const panelDiameter = document.getElementById('panel-diameter');
        const panelCrossSection = document.getElementById('panel-cross-section');

        const allInputs = {
            current: document.getElementById('current'),
            diameter: document.getElementById('diameter'),
            crossSection: document.getElementById('cross-section'),
            voltage: document.getElementById('voltage'),
            length: document.getElementById('length'),
        };

        const materialSelect = document.getElementById('material');
        const installationSelect = document.getElementById('installation');

        const resultsContainer = document.getElementById('results-container');
        const errorMessageDiv = document.getElementById('error-message');

        const resultSpans = {
            crossSection: document.getElementById('result-cross-section'),
            standardCrossSection: document.getElementById('result-standard-cross-section'),
            diameter: document.getElementById('result-diameter'),
            current: document.getElementById('result-current'),
            voltagedrop: document.getElementById('result-voltagedrop')
        };

        const resultContainers = {
            crossSection: document.getElementById('result-cross-section-container'),
            standardCrossSection: document.getElementById('result-standard-cross-section-container'),
            diameter: document.getElementById('result-diameter-container'),
            current: document.getElementById('result-current-container'),
            voltagedrop: document.getElementById('result-voltagedrop-container')
        };

        let activeTab = 'current';

        function saveState() {
            try {
                const data = {
                    activeTab: activeTab,
                    current: allInputs.current.value,
                    diameter: allInputs.diameter.value,
                    crossSection: allInputs.crossSection.value,
                    voltage: allInputs.voltage.value,
                    length: allInputs.length.value,
                    material: materialSelect.value,
                    installation: installationSelect.value
                };
                localStorage.setItem('leitungsquerschnitt_data', JSON.stringify(data));
            } catch (e) {}
        }

        function setTabUI(tab) {
            activeTab = tab;
            [tabCurrent, tabDiameter, tabCrossSection].forEach(t => t.classList.remove('active'));
            [panelCurrent, panelDiameter, panelCrossSection].forEach(p => p.classList.add('hidden'));

            if (tab === 'current') {
                tabCurrent.classList.add('active');
                panelCurrent.classList.remove('hidden');
            } else if (tab === 'diameter') {
                tabDiameter.classList.add('active');
                panelDiameter.classList.remove('hidden');
            } else {
                tabCrossSection.classList.add('active');
                panelCrossSection.classList.remove('hidden');
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('leitungsquerschnitt_data');
                if (!saved) {
                    setTabUI('current');
                    return;
                }
                const data = JSON.parse(saved);

                if (data.current !== undefined) allInputs.current.value = data.current;
                if (data.diameter !== undefined) allInputs.diameter.value = data.diameter;
                if (data.crossSection !== undefined) allInputs.crossSection.value = data.crossSection;
                if (data.voltage !== undefined) allInputs.voltage.value = data.voltage;
                if (data.length !== undefined) allInputs.length.value = data.length;
                if (data.material !== undefined) materialSelect.value = data.material;
                if (data.installation !== undefined) installationSelect.value = data.installation;

                setTabUI(data.activeTab || 'current');
            } catch (e) {
                setTabUI('current');
            }
        }

        function parseGermanFloat(str) {
            if (typeof str !== 'string') return NaN;
            const cleaned = str.replace(/\./g, '').replace(',', '.');
            if (cleaned.trim() === '') return NaN;
            return parseFloat(cleaned);
        }

        function formatToGermanString(num, decimals) {
            if (typeof num !== 'number' || isNaN(num)) return '';
            return new Intl.NumberFormat('de-DE', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            }).format(num);
        }

        function handleInput(e) {
            let cursorPosition = e.target.selectionStart;
            let originalValue = e.target.value;

            let normalizedValue = originalValue.replace(/\./g, ',');
            let cleanValue = normalizedValue.replace(/[^0-9,]/g, '');

            const parts = cleanValue.split(',');
            if (parts.length > 2) {
                cleanValue = parts[0] + ',' + parts.slice(1).join('');
            }

            e.target.value = cleanValue;

            if (originalValue !== cleanValue) {
                cursorPosition = cursorPosition + (cleanValue.length - originalValue.length);
            }
            try {
                e.target.setSelectionRange(cursorPosition, cursorPosition);
            } catch (err) {}

            saveState();
            calculate();
        }

        function handleFocus(e) {
            const rawValue = e.target.value.replace(/\./g, '');
            if (rawValue) {
                e.target.value = rawValue;
            }
        }

        function formatNumericInput(event, decimals) {
            const input = event.target;
            const value = parseGermanFloat(input.value);
            if (!isNaN(value)) {
                const hasComma = input.value.includes(',');
                const currentDecimals = hasComma ? Math.min(input.value.split(',')[1].length, decimals) : 0;
                const formattedValue = formatToGermanString(value, currentDecimals);
                if (input.value && input.value !== formattedValue) {
                    input.value = formattedValue;
                }
            }
            saveState();
            calculate();
        }

        function switchTab(tab) {
            setTabUI(tab);
            saveState();
            calculate();
        }

        function calculate() {
            errorMessageDiv.classList.add('hidden');
            const voltage = parseGermanFloat(allInputs.voltage.value);
            const length = parseGermanFloat(allInputs.length.value);
            const material = materialSelect.value;
            const installation = installationSelect.value;

            if (isNaN(voltage) || voltage <= 0 || isNaN(length) || length <= 0) {
                resultsContainer.classList.add('hidden');
                return;
            }

            if (activeTab === 'current') {
                const current = parseGermanFloat(allInputs.current.value);
                if (isNaN(current) || current <= 0) {
                    resultsContainer.classList.add('hidden');
                    return;
                }
                const capacityList = currentCapacity[material][installation];
                let thermalCs = standardCrossSections.find((cs, i) => capacityList[i] >= current);
                if (!thermalCs) {
                    resultsContainer.classList.add('hidden');
                    return;
                }
                const vDropCs = (2 * length * current) / (CONDUCTIVITY[material] * (voltage * VOLTAGE_DROP_LIMIT));
                let finalCs = standardCrossSections.find(cs => cs >= thermalCs && cs >= vDropCs);
                if (!finalCs) {
                    resultsContainer.classList.add('hidden');
                    return;
                }
                displayResults({
                    crossSection: finalCs,
                    diameter: 2 * Math.sqrt(finalCs / Math.PI),
                    voltagedrop: {
                        v: (2 * length * current) / (CONDUCTIVITY[material] * finalCs),
                        percent: (((2 * length * current) / (CONDUCTIVITY[material] * finalCs)) / voltage) * 100
                    }
                });
            } else {
                let cs = activeTab === 'diameter'
                    ? Math.PI * Math.pow(parseGermanFloat(allInputs.diameter.value) / 2, 2)
                    : parseGermanFloat(allInputs.crossSection.value);

                if (isNaN(cs) || cs <= 0) {
                    resultsContainer.classList.add('hidden');
                    return;
                }
                const std = standardCrossSections.find(s => s >= cs);
                let res = { crossSection: cs, diameter: 2 * Math.sqrt(cs / Math.PI) };
                if (std) {
                    res.standardCrossSection = std;
                    const maxI = Math.min(
                        currentCapacity[material][installation][standardCrossSections.indexOf(std)],
                        (std * CONDUCTIVITY[material] * (voltage * VOLTAGE_DROP_LIMIT)) / (2 * length)
                    );
                    res.maxCurrent = maxI;
                    res.voltagedrop = {
                        v: (2 * length * maxI) / (CONDUCTIVITY[material] * std),
                        percent: (((2 * length * maxI) / (CONDUCTIVITY[material] * std)) / voltage) * 100
                    };
                }
                displayResults(res);
            }
        }

        function displayResults(results) {
            resultsContainer.classList.remove('hidden');
            Object.values(resultContainers).forEach(c => c.classList.add('hidden'));

            if (results.crossSection) {
                resultSpans.crossSection.textContent = `${results.crossSection.toLocaleString('de-DE', {maximumFractionDigits:3})} mm²`;
            }
            if (results.standardCrossSection) {
                resultSpans.standardCrossSection.textContent = `${results.standardCrossSection.toLocaleString('de-DE', {maximumFractionDigits:3})} mm²`;
            }
            if (results.diameter) {
                resultSpans.diameter.textContent = `${results.diameter.toLocaleString('de-DE', {maximumFractionDigits:3})} mm`;
            }
            if (results.maxCurrent) {
                resultSpans.current.textContent = `${results.maxCurrent.toLocaleString('de-DE', {maximumFractionDigits:2})} A`;
            }
            if (results.voltagedrop) {
                resultSpans.voltagedrop.textContent = `${results.voltagedrop.v.toLocaleString('de-DE', {maximumFractionDigits:2})} V (${results.voltagedrop.percent.toLocaleString('de-DE', {maximumFractionDigits:2})} %)`;
            }

            if (activeTab === 'current') {
                resultContainers.crossSection.classList.remove('hidden');
                resultContainers.diameter.classList.remove('hidden');
                resultContainers.voltagedrop.classList.remove('hidden');
            } else {
                resultContainers.standardCrossSection.classList.remove('hidden');
                resultContainers.current.classList.remove('hidden');
                resultContainers.voltagedrop.classList.remove('hidden');
                if (activeTab === 'diameter') resultContainers.crossSection.classList.remove('hidden');
                else resultContainers.diameter.classList.remove('hidden');
            }
        }

        // --- Event Listener registrieren ---
        tabCurrent.addEventListener('click', () => switchTab('current'));
        tabDiameter.addEventListener('click', () => switchTab('diameter'));
        tabCrossSection.addEventListener('click', () => switchTab('crossSection'));

        ['current', 'diameter', 'crossSection', 'voltage', 'length'].forEach(id => {
            const input = allInputs[id];
            input.addEventListener('input', handleInput);
            input.addEventListener('focus', handleFocus);
            input.addEventListener('blur', (e) => formatNumericInput(e, 3));
        });

        materialSelect.addEventListener('change', () => {
            saveState();
            calculate();
        });
        installationSelect.addEventListener('change', () => {
            saveState();
            calculate();
        });

        loadState();
        calculate();
    </script>
</body>
</html>
